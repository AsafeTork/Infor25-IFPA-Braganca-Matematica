<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aluno · Informática 25</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/boxes.css">
<link rel="stylesheet" href="styles/explorer.css">
<link rel="stylesheet" href="styles/aluno.css">
<link rel="stylesheet" href="styles/trigVisuals.css">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<style>
.al-lesson-btn.locked {
  opacity: 0.5;
  cursor: not-allowed;
  pointer-events: none;
}
.al-ch-btn .lock-icon {
  margin-left: auto;
  font-size: .8rem;
  opacity: 0.6;
}
.al-module-score {
  font-family: var(--font-mono);
  font-size: .6rem;
  color: var(--text-mut);
  margin-left: .3rem;
}
.al-unlock-btn {
  width: 100%;
  padding: .4rem .75rem;
  border: none;
  background: var(--accent-soft);
  color: var(--accent);
  font-family: var(--font-display);
  font-size: .75rem;
  cursor: pointer;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
.al-unlock-btn:hover {
  background: var(--accent);
  color: white;
}
</style>
</head>
<body>

<!-- Overlay (mobile) -->
<div class="al-overlay" id="overlay"></div>

<!-- Topbar -->
<header class="al-top">
  <button class="al-menu-btn" id="menu-btn" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M3 7h18M3 12h18M3 17h18"/>
    </svg>
  </button>
  <a class="al-brand" href="index.html">Informática <b>25</b></a>
  <div class="al-topright">
    <div class="al-zoom" id="zoom-control" style="display:none;align-items:center;gap:.3rem;">
      <button class="al-zoom-btn" id="zoom-out" title="Diminuir">−</button>
      <span class="al-zoom-label" id="zoom-label">100%</span>
      <button class="al-zoom-btn" id="zoom-in" title="Aumentar">+</button>
    </div>
    <a href="professor.html" class="al-toplink">Professor</a>
    <button class="theme-toggle" id="tg" aria-label="Tema"></button>
  </div>
</header>

<!-- Layout -->
<div class="al-layout">

  <!-- Sidebar -->
  <aside class="al-sidebar" id="sidebar">
    <div class="al-sidebar-inner" id="sidebar-inner">
      <!-- chapters injected here -->
    </div>
  </aside>

  <!-- Main content -->
  <main class="al-main" id="main">
    <div class="al-lesson-head" id="lesson-head">
      <div class="al-crumb" id="crumb"></div>
      <h1 class="al-title" id="title">…</h1>
    </div>
<div class="al-lesson-body" id="lesson"></div>
    <div class="al-lesson-nav">
      <button class="btn ghost" id="prev" disabled>← Anterior</button>
      <button class="btn primary" id="next">Próximo →</button>
    </div>
  </main>
</div>

<script type="module">
import { initTheme, mountThemeToggle } from "./core/theme.js";
import { mountFloatingKeypad } from "./components/keypad.js";
import { potenciacaoLessons, potenciacaoMeta } from "./features/potenciacao/index.js";
import { exponencialLessons, exponencialMeta } from "./features/exponencial/index.js";
import { sequenciasLessons, sequenciasMeta } from "./features/sequencias/index.js";
import { trigonometriaLessons, trigonometriaMeta } from "./features/trigonometria/index.js";
import { OverlayManager } from "./core/overlays.js";
import { renderOverlaysOnTrigCircle } from "./core/overlayRenderers.js";

initTheme();
mountThemeToggle(document.getElementById("tg"));
mountFloatingKeypad();

// Zoom control (desktop only)
let zoomLevel = 100;
const zoomControl = document.getElementById("zoom-control");
const zoomLabel = document.getElementById("zoom-label");

if (window.innerWidth >= 900 && zoomControl) {
  zoomControl.style.display = "flex";
  
  document.getElementById("zoom-in").addEventListener("click", () => {
    if (zoomLevel < 200) {
      zoomLevel += 10;
      applyZoom();
    }
  });
  
  document.getElementById("zoom-out").addEventListener("click", () => {
    if (zoomLevel > 80) {
      zoomLevel -= 10;
      applyZoom();
    }
  });
  
  function applyZoom() {
    const scale = zoomLevel / 100;
    document.documentElement.style.setProperty("--zoom-scale", scale);
    zoomLabel.textContent = zoomLevel + "%";
    localStorage.setItem("zoom-level", zoomLevel);
  }
  
  const saved = localStorage.getItem("zoom-level");
  if (saved) {
    zoomLevel = parseInt(saved);
    applyZoom();
  } else {
    document.documentElement.style.setProperty("--zoom-scale", 1);
  }
}

const MODULES = [
  { meta: potenciacaoMeta,   lessons: potenciacaoLessons },
  { meta: exponencialMeta,   lessons: exponencialLessons },
  { meta: sequenciasMeta,    lessons: sequenciasLessons },
  { meta: trigonometriaMeta, lessons: trigonometriaLessons },
];
const ALL = MODULES.flatMap(m => m.lessons.map(l => ({ ...l, meta: m.meta })));

/* ── Progress Tracking ── */
function saveLessonScore(lessonId, correct, total) {
  const scores = JSON.parse(localStorage.getItem('quizScores') || '{}');
  scores[lessonId] = { correct, total, score: Math.round(correct / total * 100) };
  localStorage.setItem('quizScores', JSON.stringify(scores));
}

function getLessonScore(lessonId) {
  const scores = JSON.parse(localStorage.getItem('quizScores') || '{}');
  return scores[lessonId] || null;
}

function getModuleScore(moduleIndex) {
  const moduleLessons = MODULES[moduleIndex].lessons;
  const scores = moduleLessons.map(l => getLessonScore(l.id)).filter(Boolean);
  if (scores.length === 0) return 0;
  const avg = scores.reduce((sum, s) => sum + s.score, 0) / scores.length;
  return Math.round(avg);
}

function isModuleUnlocked(moduleIndex) {
  if (moduleIndex === 0) return true; // First module always unlocked
  if (sessionStorage.getItem('adminAccess') === 'true') return true;
  const prevScore = getModuleScore(moduleIndex - 1);
  return prevScore >= 75;
}

function checkAdminPassword() {
  const pwd = prompt('Senha do professor:');
  if (pwd === 'admin' || pwd === 'prof2025') {
    sessionStorage.setItem('adminAccess', 'true');
    buildSidebar(currentLessonId);
    return true;
  }
  return false;
}

// Track current lesson for admin unlock refresh
let currentLessonId = null;

/* ── Build collapsible sidebar ── */
const sidebarInner = document.getElementById("sidebar-inner");

// Track which chapters are open (default: first one open)
const openState = MODULES.map((_, i) => i === 0);

let sidebarBuilt = false;

function buildSidebar(currentId) {
  currentLessonId = currentId;
  
  // Build once — depois só atualiza o item ativo
  if (!sidebarBuilt) {
    sidebarInner.innerHTML = MODULES.map((m, mi) => {
      const isOpen = openState[mi];
      const unlocked = isModuleUnlocked(mi);
      const moduleScore = getModuleScore(mi);
      const scoreDisplay = moduleScore > 0 ? ` <span class="al-module-score">${moduleScore}%</span>` : '';
      
      return `
      <div class="al-chapter" data-mi="${mi}">
        <button class="al-ch-btn ${isOpen ? 'open' : ''}" data-mi="${mi}">
          <span class="al-ch-num">${m.meta.num}</span>
          <span class="al-ch-title">${m.meta.title}${scoreDisplay}</span>
          ${!unlocked ? '<span class="lock-icon">🔒</span>' : ''}
          <svg class="al-ch-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="al-ch-lessons ${isOpen ? 'open' : ''}" id="ch-lessons-${mi}">
          ${m.lessons.map(l => `
            <button class="al-lesson-btn ${!unlocked ? 'locked' : ''}" data-id="${l.id}" ${!unlocked ? 'disabled' : ''}>
              ${l.title}
            </button>`).join("")}
          ${!unlocked ? `<button class="al-unlock-btn" data-unlock="${mi}">🔑 Desbloquear módulo</button>` : ''}
        </div>
      </div>`;
    }).join("");

    // Chapter toggle — bind uma vez
    sidebarInner.querySelectorAll(".al-ch-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const mi = +btn.dataset.mi;
        openState[mi] = !openState[mi];
        btn.classList.toggle("open", openState[mi]);
        document.getElementById(`ch-lessons-${mi}`).classList.toggle("open", openState[mi]);
      });
    });

    // Lesson click — bind uma vez com delegação
    sidebarInner.addEventListener("click", e => {
      const btn = e.target.closest(".al-lesson-btn");
      if (btn && !btn.classList.contains("locked")) { 
        go(btn.dataset.id); 
        closeSidebar(); 
      }
      
      // Unlock button
      const unlockBtn = e.target.closest(".al-unlock-btn");
      if (unlockBtn) {
        const mi = +unlockBtn.dataset.unlock;
        if (checkAdminPassword()) {
          buildSidebar(currentLessonId);
        }
      }
    });

    sidebarBuilt = true;
  }

  // Só atualiza classe active — sem recriar DOM
  sidebarInner.querySelectorAll(".al-lesson-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.id === currentId);
  });

  // Abrir capítulo do item ativo se estiver fechado
  if (currentId) {
    const mi = MODULES.findIndex(m => m.lessons.some(l => l.id === currentId));
    if (mi >= 0 && !openState[mi]) {
      openState[mi] = true;
      const chBtn = sidebarInner.querySelector(`.al-ch-btn[data-mi="${mi}"]`);
      const chList = document.getElementById(`ch-lessons-${mi}`);
      if (chBtn) chBtn.classList.add("open");
      if (chList) chList.classList.add("open");
    }
  }
}

/* ── Mobile sidebar ── */
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const menuBtn = document.getElementById("menu-btn");

function openSidebar() { sidebar.classList.add("open"); overlay.classList.add("active"); }
function closeSidebar() { sidebar.classList.remove("open"); overlay.classList.remove("active"); }

menuBtn.addEventListener("click", () =>
  sidebar.classList.contains("open") ? closeSidebar() : openSidebar());
overlay.addEventListener("click", closeSidebar);

/* ── Navigation ── */
let cur = 0;
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const crumbEl = document.getElementById("crumb");
const titleEl = document.getElementById("title");
const lessonEl = document.getElementById("lesson");

/* ── Quiz Score Tracking ── */
document.addEventListener("quizComplete", (e) => {
  const { lessonId, correct, total } = e.detail;
  saveLessonScore(lessonId, correct, total);
  // Rebuild sidebar to show updated scores
  buildSidebar(currentLessonId);
});

/* ── Student OverlayManager (read-only) ── */
const overlayMgr = new OverlayManager();
overlayMgr.registerTarget("trig-canvas", "trigCircle", null);
window.__alunoOverlayMgr = overlayMgr;

function syncTrigOverlays() {
  const allOverlays = overlayMgr.getAll();
  const canvases = lessonEl.querySelectorAll("canvas");
  for (const cv of canvases) {
    const ucRoot = cv.closest(".uc-root");
    if (!ucRoot) continue;
    let ovc = ucRoot.querySelector(".al-overlay-canvas");
    if (!ovc) {
      ovc = document.createElement("canvas");
      ovc.className = "al-overlay-canvas";
      ovc.style.cssText = "position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;border-radius:8px;";
      ucRoot.style.position = "relative";
      ucRoot.appendChild(ovc);
    }
    const W = cv.clientWidth || cv.offsetWidth || 300;
    const H = cv.clientHeight || cv.offsetHeight || 300;
    const dpr = window.devicePixelRatio || 1;
    ovc.width = W * dpr;
    ovc.height = H * dpr;
    const ctx = ovc.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (allOverlays.length === 0) continue;
    const pad = 40;
    const circleInfo = { cx: W / 2, cy: H / 2, r: Math.min(W, H) / 2 - pad, W, H };
    for (const ov of allOverlays) {
      renderOverlaysOnTrigCircle(ctx, circleInfo, [{ ...ov.props, type: ov.type }]);
    }
  }
}
overlayMgr.onChange(syncTrigOverlays);

function go(id) {
  const idx = ALL.findIndex(l => l.id === id);
  if (idx < 0) return;
  
  // Check if lesson is in a locked module
  const mi = MODULES.findIndex(m => m.lessons.some(le => le.id === id));
  if (mi >= 0 && !isModuleUnlocked(mi)) {
    alert('Este módulo está bloqueado. Complete o módulo anterior com pelo menos 75% para desbloquear.');
    return;
  }
  
  cur = idx;
  const l = ALL[cur];

  // Open that chapter if collapsed
  if (mi >= 0 && !openState[mi]) { openState[mi] = true; }

  crumbEl.textContent = `${l.meta.chapter}`;
  titleEl.textContent = l.title;
  lessonEl.innerHTML = "";

  const boot = () => {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        l.render(lessonEl);
        syncTrigOverlays();
      });
    });
  };
  if (window.katex) boot();
  else window.addEventListener("load", boot, { once: true });

  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur >= ALL.length - 1;
  prevBtn.style.visibility = cur === 0 ? "hidden" : "visible";
  nextBtn.style.visibility = cur >= ALL.length - 1 ? "hidden" : "visible";
  history.replaceState(null, "", "#" + id);

  buildSidebar(id);
  // Scroll to top of content
  document.getElementById("main").scrollTo({ top: 0, behavior: "smooth" });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

prevBtn.addEventListener("click", () => { if (cur > 0) go(ALL[cur - 1].id); });
nextBtn.addEventListener("click", () => { if (cur < ALL.length - 1) go(ALL[cur + 1].id); });

const hash = location.hash.slice(1);
buildSidebar(null);
// Defer initial render until after browser paint — eliminates load-time reflows
requestAnimationFrame(() => {
  go(hash && ALL.find(l => l.id === hash) ? hash : ALL[0].id);
});
</script>
</body>
</html>
