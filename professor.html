<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Professor · Informática 25</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/professor.css">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<style>
/* Refatoração professor.html: grid responsivo e touch targets (integração com professor.css) — mobile-first: base 320-480px */
.tools-grid{grid-template-columns:1fr 1fr;gap:.3rem}
@media(min-width:480px){.tools-grid{grid-template-columns:1fr 1fr 1fr}}
.tool-btn,.ctrl-btn{min-height:44px}
.frow-eye,.frow-del{min-height:36px}
@media(min-width:481px){.tool-btn,.ctrl-btn{min-height:36px}}
@media(max-width:480px){.frow-eye,.frow-del{width:44px!important;height:44px!important;min-width:44px!important;min-height:44px!important} #tool-clear,#tool-undo,#tool-redo{min-height:44px!important} [data-layer-eye],[data-layer-del]{width:44px!important;height:44px!important;min-width:44px!important;min-height:44px!important}}
.tool-btn{font-size:.78rem}
.frow-eye{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--surface-2);color:var(--text-mut);border-radius:6px;cursor:pointer;font-size:.75rem;flex-shrink:0;transition:all .15s}
.frow-eye:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>

<header class="prof-top" role="banner">
  <a class="prof-brand" href="index.html">Informática <b>25</b></a>
  <a href="aluno.html" class="prof-toplink">Aluno</a>
  <button class="theme-toggle" id="theme-btn" aria-label="Alternar tema"></button>
</header>

<div class="prof-wrap">
  <div class="prof-stage" id="prof-stage">
    <canvas id="plot-canvas" style="touch-action:none"></canvas>
    <div class="prof-labels" id="prof-labels"></div>
  </div>

  <!-- Painel lateral (desktop/tablet) -->
  <div class="prof-panel" id="prof-panel" role="complementary" aria-label="Painel de controle">
    <div class="prof-context">Gráficos interativos · Informática 25</div>

    <!-- 1. Fórmulas -->
    <div class="prof-section">
      <div class="prof-section-title">Fórmulas</div>
      <div id="formulas-rows"></div>
      <button class="ctrl-btn" id="btn-add" style="width:100%;margin-top:.4rem;text-align:center" aria-label="Adicionar fórmula" title="Adicionar fórmula">+ linha</button>
    </div>

    <!-- 2. Controles (π eixo, círculo, reset, download) -->
    <div class="prof-section">
      <div class="prof-controls">
        <button class="ctrl-btn" id="btn-pi" aria-label="Alternar eixo em múltiplos de pi" title="Alternar eixo em múltiplos de pi">π eixo</button>
        <button class="ctrl-btn" id="btn-circle" aria-label="Alternar círculo unitário" title="Alternar círculo unitário">Círculo</button>
        <button class="ctrl-btn" id="btn-reset" aria-label="Resetar vista" title="Resetar vista">Reset</button>
        <div class="prof-download-wrap">
          <button class="ctrl-btn" id="btn-download" aria-label="Baixar gráfico" aria-haspopup="true" title="Baixar gráfico">Baixar</button>
          <div class="prof-download-menu" id="download-menu" role="menu">
            <button role="menuitem" data-format="png">PNG (2x)</button>
            <button role="menuitem" data-format="svg">SVG vetorial</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Info do círculo unitário (exibida quando Círculo ativo) -->
    <div class="uc-info" id="uc-info" aria-label="Informações do círculo trigonométrico">
      <div class="uc-row"><span class="uc-k">cos θ</span><span class="uc-val" id="uc-cos">—</span></div>
      <div class="uc-row"><span class="uc-k">sin θ</span><span class="uc-val" id="uc-sin">—</span></div>
      <div class="uc-row"><span class="uc-k">tan θ</span><span class="uc-val" id="uc-tan">—</span></div>
      <div class="uc-row"><span class="uc-k">θ</span><span class="uc-val" id="uc-ang">—</span></div>
      <div class="uc-snap" id="uc-snap"></div>
      <div class="uc-set">
        <div class="uc-set-title">Definir ângulo</div>
        <div style="display:flex;gap:.3rem;margin-bottom:.3rem;">
          <button class="uc-tab active" id="tab-pos" aria-label="Ângulos positivos">+ positivos</button>
          <button class="uc-tab" id="tab-neg" aria-label="Ângulos negativos">− negativos</button>
        </div>
        <div class="uc-angle-grid" id="uc-angle-grid"></div>
        <div class="uc-custom">
          <input id="uc-custom-inp" name="uc-angle" autocomplete="off" placeholder="ex: -π/3 ou -90°" aria-label="Ângulo personalizado">
          <button id="uc-negate-btn" title="Negar ângulo atual" aria-label="Negar ângulo">±</button>
          <button id="uc-custom-btn" aria-label="Aplicar ângulo">→</button>
        </div>
      </div>
      <button class="uc-tri-btn" id="uc-tri-btn" style="width:100%;margin-top:.5rem;padding:.35rem;background:var(--accent);color:#000;border:none;border-radius:6px;font-weight:700;font-size:.75rem;cursor:pointer">Triângulo no círculo</button>
      <div style="display:flex;gap:.4rem;margin-top:.4rem;align-items:center">
        <button id="uc-play-btn" style="flex:1;padding:.35rem;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:6px;font-weight:600;font-size:.75rem;cursor:pointer">▶ Play</button>
        <label style="display:flex;align-items:center;gap:.25rem;font-size:.7rem;color:var(--text-mut)"><span>voltas</span><input id="uc-play-limit" type="number" min="1" max="10" value="3" style="width:40px;padding:.2rem;border:1px solid var(--border);border-radius:4px;background:var(--surface-2);color:var(--text);text-align:center"></label>
        <label style="display:flex;align-items:center;gap:.25rem;font-size:.7rem;color:var(--text-mut)"><span>vel</span><input id="uc-play-speed" type="range" min="0.2" max="3" step="0.2" value="1.2" style="width:60px;accent-color:var(--accent)"><span id="uc-speed-val" style="min-width:22px;text-align:center">1.2x</span></label>
        <button id="uc-dir-btn" title="Direção: horário/anti-horário" style="padding:.35rem .5rem;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:.75rem;cursor:pointer">↻ Horário</button>
      </div>
    </div>

    <!-- 3. Ferramentas · 4. Camadas · 5. Presets — ordem canônica Fórmulas→Controles→Ferramentas→Camadas→Presets→Readout -->
    <div class="prof-presets-wrap" id="prof-presets-wrap">
      <!-- 3. Ferramentas -->
      <details class="tools-details" id="tools-section">
        <summary class="preset-group-title" style="cursor:pointer;padding:.3rem .25rem;list-style:none;display:flex;justify-content:space-between" aria-label="Ferramentas de anotação" title="Ferramentas de anotação">
          Ferramentas <span style="opacity:.5">▾</span>
        </summary>
        <div style="padding:.25rem 0">
          <div class="tools-grid" role="toolbar" aria-label="Ferramentas" aria-orientation="horizontal">
            <button class="tool-btn" id="tool-marker" aria-pressed="false" aria-label="Marcar ponto" title="Marcar ponto"><span class="tool-dot" style="background:var(--accent);width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block"></span> Ponto</button>
            <button class="tool-btn" id="tool-vline" aria-pressed="false" aria-label="Linha vertical" title="Linha vertical">Vertical</button>
            <button class="tool-btn" id="tool-hline" aria-pressed="false" aria-label="Linha horizontal" title="Linha horizontal">Horizontal</button>
            <button class="tool-btn" id="tool-area" aria-pressed="false" aria-label="Sombrear área" title="Sombrear área">Área</button>
            <button class="tool-btn" id="tool-triangle" aria-pressed="false" aria-label="Triângulo" title="Triângulo">Triângulo</button>
            <button class="tool-btn" id="tool-text" aria-pressed="false" aria-label="Adicionar texto" title="Adicionar texto">Texto</button>
            <button class="tool-btn" id="tool-arrow" aria-pressed="false" aria-label="Desenhar seta" title="Desenhar seta">Seta</button>
            <button class="tool-btn" id="tool-ruler" aria-pressed="false" aria-label="Régua para medir distância" title="Régua para medir distância">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M3 17 L21 7 L17 3 L3 13 Z"/>
                <path d="M7 13 L8 12"/>
                <path d="M10 11 L11 10"/>
                <path d="M13 9 L14 8"/>
                <path d="M16 8 L17 7"/>
              </svg> Régua</button>
            <button class="tool-btn" data-tool="eraser" id="tool-eraser" aria-pressed="false" aria-label="Borracha para apagar" title="Borracha para apagar">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M20 20H7L3 16c-.8-.8-.8-2 0-2.8L14.8 1.4c.8-.8 2-.8 2.8 0L22 5.8c.8.8.8 2 0 2.8L12 18"/>
              </svg> Borracha
            </button>
          </div>
          <div class="color-row" id="tool-colors" style="margin:.35rem 0" role="radiogroup" aria-label="Cor da ferramenta">
            <div class="color-dot active" data-c="#ffa500" style="background:#ffa500" role="radio" aria-checked="true" aria-label="Laranja" tabindex="0"></div>
            <div class="color-dot" data-c="#ffd23f" style="background:#ffd23f" role="radio" aria-checked="false" aria-label="Amarelo" tabindex="0"></div>
            <div class="color-dot" data-c="#60a5fa" style="background:#60a5fa" role="radio" aria-checked="false" aria-label="Azul" tabindex="0"></div>
            <div class="color-dot" data-c="#34d399" style="background:#34d399" role="radio" aria-checked="false" aria-label="Verde" tabindex="0"></div>
            <div class="color-dot" data-c="#f472b6" style="background:#f472b6" role="radio" aria-checked="false" aria-label="Rosa" tabindex="0"></div>
            <div class="color-dot" data-c="#f87171" style="background:#f87171" role="radio" aria-checked="false" aria-label="Vermelho" tabindex="0"></div>
            <div class="color-dot" data-c="#e2e8f0" style="background:#e2e8f0" role="radio" aria-checked="false" aria-label="Branco" tabindex="0"></div>
          </div>
          <div class="opacity-row">
            <input type="range" id="area-opacity" min="5" max="60" value="25" aria-label="Opacidade">
            <span id="area-opacity-val">25%</span>
          </div>
          <label style="display:flex;align-items:center;gap:.4rem;margin-top:.4rem;font-size:.72rem;color:var(--text-soft);cursor:pointer;user-select:none">
            <input type="checkbox" id="tri-show-values" checked style="accent-color:var(--accent);width:14px;height:14px"> Mostrar medidas do triângulo
          </label>
          <button class="tool-btn" id="tool-clear" style="margin-top:.3rem;width:100%;justify-content:center" aria-label="Limpar destaques" title="Limpar destaques">Limpar destaques</button>
          <div style="display:flex;gap:.3rem;margin-top:.3rem">
            <button class="tool-btn" id="tool-undo" style="flex:1;justify-content:center" aria-label="Desfazer (Ctrl+Z)" title="Desfazer (Ctrl+Z)">Desfazer</button>
            <button class="tool-btn" id="tool-redo" style="flex:1;justify-content:center" aria-label="Refazer (Ctrl+Y)" title="Refazer (Ctrl+Y)">Refazer</button>
          </div>
        </div>
      </details>
      <!-- 4. Camadas (com ocultar/mostrar) -->
      <div class="layers-panel" id="layers-panel" style="margin-top:.6rem;border-top:1px solid var(--border);padding-top:.5rem">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.3rem">
          <span style="font-family:var(--font-mono);font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mut)">Camadas</span>
          <span id="layers-count" style="font-size:.65rem;color:var(--text-mut)">0</span>
        </div>
        <div id="layers-list" style="display:flex;flex-direction:column;gap:.25rem;max-height:160px;overflow-y:auto"></div>
      </div>
      <!-- 5. Presets -->
      <div id="prof-presets"></div>
    </div>

    <!-- 6. Readout -->
    <div class="prof-readout" id="readout">x = —   y = —</div>
  </div>
</div>

<!-- Bottom toolbar (mobile) -->
<nav class="prof-bottom-bar" id="prof-bottom-bar" role="toolbar" aria-label="Barra de ferramentas móvel">
  <button class="prof-bar-btn" data-panel="formulas" aria-label="Fórmulas" title="Fórmulas"><span style="font-family:var(--font-mono);font-size:.68rem;font-weight:700">f(x)</span></button>
  <button class="prof-bar-btn" data-panel="tools" aria-label="Ferramentas" title="Ferramentas"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></button>
  <button class="prof-bar-btn" data-panel="circle" aria-label="Círculo trigonométrico" title="Círculo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 12 L19 12"/><path d="M12 12 L15.5 8.5"/></svg></button>
  <button class="prof-bar-btn" data-panel="download" aria-label="Baixar gráfico" title="Baixar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v13"/><path d="M8 11l4 4 4-4"/><path d="M3 17v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2"/></svg></button>
  <button class="prof-bar-btn" data-action="reset" aria-label="Resetar vista" title="Resetar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v6h-6"/></svg></button>
  <button class="prof-bar-btn" data-action="theme" aria-label="Alternar tema" title="Tema"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
</nav>

<!-- Bottom sheet overlay (mobile) — camada de fundo para fechar painel móvel -->
<div class="prof-sheet-overlay" id="sheet-overlay"></div>

<!-- Bottom sheet content (mobile) — #prof-sheet mantido para compatibilidade mas sheet real é #prof-panel.open (mobile: fixed bottom:0 max-height:70vh translateY(100%) → .open{translateY(0)}; desktop: position:relative) — controlado via profPanel, openSheet/closeSheet, sheetOverlay e handle; não é dead code, apenas oculto em desktop -->
<div class="prof-sheet" id="prof-sheet" role="dialog" aria-label="Painel de ferramentas">
  <div class="prof-sheet-handle"></div>
  <div id="sheet-content"></div>
</div>

<!-- Paleta de cores para fórmulas -->
<div class="color-palette hidden" id="color-palette"></div>

<script type="module">
import { initTheme, mountThemeToggle } from "./core/theme.js";
import { compile } from "./core/mathEngine.js";
import { Plot, formatExactValue } from "./core/plotEngine.js";
import { mountFloatingKeypad } from "./components/keypad.js";
import { OverlayManager, OverlayType } from "./core/overlays.js";
import { renderOverlaysOnPlot } from "./core/overlayRenderers.js";

initTheme();
mountThemeToggle(document.getElementById("theme-btn"));
mountFloatingKeypad();

const COLORS = ["#ffa500","#ffd23f","#60a5fa","#34d399","#a78bfa","#fb923c"];

const PRESET_GROUPS = [
  { title:"Exponencial", items:[
    { label:"2ˣ vs ½ˣ",   fns:["y=2^x","y=(1/2)^x"],           pi:false, uc:false },
    { label:"Bases > 1",   fns:["y=2^x","y=3^x","y=10^x"],       pi:false, uc:false },
    { label:"Juros 3%",    fns:["y=1800*(1.03)^x"],               pi:false, uc:false, view:{xmin:0,xmax:30,ymin:0,ymax:5000} },
    { label:"Decaimento",  fns:["y=100*(0.5)^x"],                 pi:false, uc:false, view:{xmin:0,xmax:10,ymin:0,ymax:110} },
  ]},
  { title:"Sequências", items:[
    { label:"PA  r=5",     fns:["y=3+(x-1)*5"],                   pi:false, uc:false, view:{xmin:0,xmax:10,ymin:-5,ymax:50} },
    { label:"PG  q=2",     fns:["y=2*2^(x-1)"],                   pi:false, uc:false, view:{xmin:0,xmax:8,ymin:-2,ymax:60} },
    { label:"PA vs PG",    fns:["y=5+(x-1)*5","y=5*1.5^(x-1)"],   pi:false, uc:false, view:{xmin:0,xmax:14,ymin:-5,ymax:100} },
  ]},
  { title:"Trigonometria", items:[
    { label:"sin(x)",      fns:["y=sin(x)"],                      pi:true,  uc:true  },
    { label:"cos(x)",      fns:["y=cos(x)"],                      pi:true,  uc:true  },
    { label:"tan(x)",      fns:["y=tan(x)"],                      pi:true,  uc:true,  view:{xmin:-Math.PI,xmax:Math.PI,ymin:-4,ymax:4} },
    { label:"sin + cos",   fns:["y=sin(x)","y=cos(x)"],           pi:true,  uc:true  },
    { label:"Círculo unit.",fns:[],                                pi:false, uc:true  },
  ]},
  { title:"Álgebra", items:[
    { label:"Parábola",    fns:["y=x^2","y=x^2-4"],               pi:false, uc:false },
    { label:"Raízes",      fns:["y=sqrt(x)","y=x^(1/3)"],         pi:false, uc:false, view:{xmin:-3,xmax:8,ymin:-3,ymax:4} },
  ]},
];

/* ──────────── PLOT ──────────── */
const canvas = document.getElementById("plot-canvas");
const plot   = new Plot(canvas, { xmin:-6, xmax:6, ymin:-4, ymax:4 });

plot.onProbe = (x, y) => {
  document.getElementById("readout").textContent =
    `x = ${formatExactValue(x)}   y = ${formatExactValue(y)}`;
};

/* ──────────── OVERLAY MANAGER ──────────── */
const overlayMgr = new OverlayManager();
overlayMgr.registerTarget("plot-main", "plot", plot);
// Exposição para testes Playwright (não afeta produção)
window.__plot = plot;
window.__overlayMgr = overlayMgr;

/* ──────────── CÍRCULO UNITÁRIO ──────────── */
const NOTABLE = [
  {a:0,           l:"0",     s:"0",    c:"1",    t:"0"   },
  {a:Math.PI/6,   l:"π/6",   s:"1/2",  c:"√3/2", t:"√3/3"},
  {a:Math.PI/4,   l:"π/4",   s:"√2/2", c:"√2/2", t:"1"   },
  {a:Math.PI/3,   l:"π/3",   s:"√3/2", c:"1/2",  t:"√3"  },
  {a:Math.PI/2,   l:"π/2",   s:"1",    c:"0",    t:"∄"   },
  {a:2*Math.PI/3, l:"2π/3",  s:"√3/2", c:"-1/2", t:"-√3" },
  {a:3*Math.PI/4, l:"3π/4",  s:"√2/2", c:"-√2/2",t:"-1"  },
  {a:5*Math.PI/6, l:"5π/6",  s:"1/2",  c:"-√3/2",t:"-√3/3"},
  {a:Math.PI,     l:"π",     s:"0",    c:"-1",   t:"0"   },
  {a:7*Math.PI/6, l:"7π/6",  s:"-1/2", c:"-√3/2",t:"√3/3"},
  {a:5*Math.PI/4, l:"5π/4",  s:"-√2/2",c:"-√2/2",t:"1"  },
  {a:4*Math.PI/3, l:"4π/3",  s:"-√3/2",c:"-1/2", t:"√3" },
  {a:3*Math.PI/2, l:"3π/2",  s:"-1",   c:"0",    t:"∄"  },
  {a:5*Math.PI/3, l:"5π/3",  s:"-√3/2",c:"1/2",  t:"-√3"},
  {a:7*Math.PI/4, l:"7π/4",  s:"-√2/2",c:"√2/2", t:"-1" },
  {a:11*Math.PI/6,l:"11π/6", s:"-1/2", c:"√3/2", t:"-√3/3"},
];

const NOTABLE_NEG = [
  {a:-Math.PI/6,   l:"-π/6",   s:"-1/2",  c:"√3/2",  t:"-√3/3"},
  {a:-Math.PI/4,   l:"-π/4",   s:"-√2/2", c:"√2/2",  t:"-1"   },
  {a:-Math.PI/3,   l:"-π/3",   s:"-√3/2", c:"1/2",   t:"-√3"  },
  {a:-Math.PI/2,   l:"-π/2",   s:"-1",    c:"0",     t:"∄"    },
  {a:-2*Math.PI/3, l:"-2π/3",  s:"-√3/2", c:"-1/2",  t:"√3"   },
  {a:-3*Math.PI/4, l:"-3π/4",  s:"-√2/2", c:"-√2/2", t:"1"    },
  {a:-5*Math.PI/6, l:"-5π/6",  s:"-1/2",  c:"-√3/2", t:"√3/3" },
  {a:-Math.PI,     l:"-π",     s:"0",     c:"-1",    t:"0"    },
  {a:-7*Math.PI/6, l:"-7π/6",  s:"1/2",   c:"-√3/2", t:"-√3/3"},
  {a:-5*Math.PI/4, l:"-5π/4",  s:"√2/2",  c:"-√2/2", t:"-1"   },
  {a:-4*Math.PI/3, l:"-4π/3",  s:"√3/2",  c:"-1/2",  t:"-√3"  },
  {a:-3*Math.PI/2, l:"-3π/2",  s:"1",     c:"0",     t:"∄"    },
  {a:-5*Math.PI/3, l:"-5π/3",  s:"√3/2",  c:"1/2",   t:"√3"   },
  {a:-7*Math.PI/4, l:"-7π/4",  s:"√2/2",  c:"√2/2",  t:"1"    },
  {a:-11*Math.PI/6,l:"-11π/6", s:"1/2",   c:"√3/2",  t:"√3/3" },
];

let ucActive  = false;
let ucTheta   = Math.PI / 3;
let ucSnapped = null;
let ucDragging = false;

function ucSnap(t, thresh = 0.1) {
  const base = t < 0
    ? -((-t) % (2*Math.PI))
    : t % (2*Math.PI);
  const list = t < 0 ? NOTABLE_NEG : NOTABLE;
  for (const k of list) {
    if (Math.abs(base - k.a) < thresh) return k;
  }
  return null;
}

function ucGetCXYR() {
  const cx = plot.X(0), cy = plot.Y(0);
  const sx = plot.W / (plot.view.xmax - plot.view.xmin);
  const sy = plot.H / (plot.view.ymax - plot.view.ymin);
  const rx = sx * 1;
  const ry = sy * 1;
  return { cx, cy, rx, ry, r: Math.min(rx, ry) };
}

function ucAutoZoom() {
  const W = canvas.clientWidth, H = canvas.clientHeight;
  const yRange = 3.2;
  const xRange = yRange * (W / H);
  plot.setView({ xmin:-xRange/2, xmax:xRange/2, ymin:-yRange/2, ymax:yRange/2 });
}

function ucDraw() {
  if (!ucActive) return;
  const ctx  = plot.ctx;
  const { cx, cy, rx, ry, r } = ucGetCXYR();
  if (r < 10) return;

  const cssFn = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const dark = document.documentElement.getAttribute("data-theme") !== "light";
  const fg   = dark ? "#e8e3da" : "#1a1a2e";
  const fgMut= dark ? "rgba(220,210,190,.35)" : "rgba(60,60,80,.28)";
  const acc  = cssFn("--accent")   || "#ffa500";
  const acc2 = cssFn("--accent-2") || "#ffd23f";
  const grn  = dark ? "#4ade80"  : "#16a34a";

  const t  = ucTheta;
  const tN = ((t % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  const co = Math.cos(t), si = Math.sin(t);
  const px = cx + rx*co, py = cy - ry*si;

  ctx.save();

  ctx.strokeStyle = fgMut; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 2*Math.PI); ctx.stroke();

  ctx.fillStyle = fgMut;
  for (const n of NOTABLE) {
    ctx.beginPath();
    ctx.arc(cx + rx*Math.cos(n.a), cy - ry*Math.sin(n.a), 2, 0, 2*Math.PI);
    ctx.fill();
  }

  const TURN_COLORS = [acc, acc2, "#60a5fa", "#34d399", "#a78bfa", "#fb923c", "#f472b6"];
  const isNeg   = ucTheta < 0;
  const absT    = Math.abs(ucTheta);
  const k       = Math.floor(absT / (2 * Math.PI));
  const partial = absT % (2 * Math.PI);
  const arcEnd = isNeg ? partial : -partial;
  const arcCCW = !isNeg;

  ctx.strokeStyle = fgMut + "55"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 2 * Math.PI); ctx.stroke();

  for (let i = 0; i < k; i++) {
    const col  = TURN_COLORS[i % TURN_COLORS.length];
    const age  = k - 1 - i;
    const opac = Math.max(30, 90 - age * 22);
    const hex  = opac.toString(16).padStart(2, "0");
    ctx.strokeStyle = col + hex; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 2 * Math.PI); ctx.stroke();
  }

  const kColor = TURN_COLORS[k % TURN_COLORS.length];
  ctx.strokeStyle = kColor + "dd"; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, arcEnd, arcCCW);
  ctx.stroke();

  ctx.strokeStyle = kColor + "99"; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx, cy, r * .2, 0, arcEnd, arcCCW);
  ctx.stroke();

  if (Math.abs(co) > 0.07) {
    const tn = si/co, tx = cx+rx, ty = cy - ry*tn;
    const H2 = plot.H;
    ctx.strokeStyle = grn+"25"; ctx.lineWidth = 1; ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(tx, 0); ctx.lineTo(tx, H2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = grn+"bb"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(tx, cy); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.strokeStyle = grn+"44"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.fillStyle = grn;
    ctx.beginPath(); ctx.arc(tx, ty, 3.5, 0, 2*Math.PI); ctx.fill();
  }
  ctx.setLineDash([]);

  ctx.strokeStyle = acc;  ctx.lineWidth = 1.8; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(cx, py); ctx.lineTo(px, py); ctx.stroke();
  ctx.strokeStyle = acc2; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(px, cy); ctx.lineTo(px, py); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = acc;  ctx.beginPath(); ctx.arc(px, cy, 4, 0, 2*Math.PI); ctx.fill();
  ctx.fillStyle = acc2; ctx.beginPath(); ctx.arc(cx, py, 4, 0, 2*Math.PI); ctx.fill();

  ctx.strokeStyle = fgMut; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(px,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(px,cy); ctx.lineTo(px,py); ctx.stroke();

  ctx.strokeStyle = fg; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(px,py); ctx.stroke();

  ctx.fillStyle = ucSnapped ? acc2 : acc;
  ctx.beginPath(); ctx.arc(px, py, 9, 0, 2*Math.PI); ctx.fill();
  ctx.strokeStyle = dark ? "rgba(8,8,20,.8)" : "rgba(255,255,255,.8)";
  ctx.lineWidth = 2; ctx.stroke();

  const fs2 = ~~(r*.1);
  ctx.font = `bold ${fs2}px monospace`;
  ctx.fillStyle = acc; ctx.textAlign = "center";
  ctx.fillText("cos θ", (cx+px)/2, cy + (si>=0?13:-10));
  ctx.fillStyle = acc2; ctx.textAlign = co>=0?"left":"right"; ctx.textBaseline="middle";
  ctx.fillText("sin θ", px+(co>=0?6:-6), (cy+py)/2);

  const la=tN/2, lr=r*.28;
  ctx.fillStyle = fg; ctx.font=`bold ${~~(r*.11)}px monospace`;
  ctx.textAlign="left"; ctx.textBaseline="middle";
  const signedDeg = (ucTheta < 0 ? -1 : 1) * partial * 180 / Math.PI;
  let lbl = ucSnapped ? ucSnapped.l : `${signedDeg.toFixed(1)}°`;
  if (k > 0) lbl += `  (k=${k})`;
  ctx.fillText(lbl, cx+lr*Math.cos(la)+4, cy-lr*Math.sin(la));

  ctx.restore();
}

function drawLabels() {
  const ctx = plot.ctx;
  const activeFormulas = formulas.filter(f => !f.hidden && f.inp.value.trim());
  if (activeFormulas.length === 0) return;

  ctx.save();
  const fs = Math.max(9, Math.min(14, Math.floor(plot.W / 60)));
  ctx.font = `bold ${fs}px monospace`;
  ctx.textAlign = "left";
  ctx.textBaseline = "top";

  let y = 8;
  for (const f of activeFormulas) {
    const text = f.inp.value.trim();
    const metrics = ctx.measureText(text);
    const pw = metrics.width + 8;
    const dark = document.documentElement.getAttribute("data-theme") !== "light";
    ctx.fillStyle = dark ? "rgba(0,0,0,0.55)" : "rgba(255,255,255,0.75)";
    ctx.fillRect(8, y - 2, pw, fs + 4);
    // texto já usa f.color, mas borda deve contrastar
    ctx.strokeStyle = dark ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.08)";
    ctx.lineWidth = 1;
    ctx.strokeRect(8, y - 2, pw, fs + 4);
    ctx.fillStyle = f.color;
    ctx.fillText(text, 12, y);
    y += fs + 6;
  }
  ctx.restore();
}

function drawPlayPoint() {
  const pts = window._playPoints || (window._playPoint && window._playPoint.visible ? [window._playPoint] : []);
  if (!pts.length) return;
  const ctx = plot.ctx;
  const dark = document.documentElement.getAttribute("data-theme") !== "light";
  for (const p of pts) {
    if (!p.visible) continue;
    if (p.x < plot.view.xmin || p.x > plot.view.xmax || p.y < plot.view.ymin || p.y > plot.view.ymax) continue;
    if (!isFinite(p.y)) continue;
    const px = plot.X(p.x), py = plot.Y(p.y);
    ctx.save();
    ctx.fillStyle = p.color || "#ffa500";
    ctx.beginPath(); ctx.arc(px, py, 6, 0, 2*Math.PI); ctx.fill();
    ctx.strokeStyle = dark ? "rgba(255,255,255,0.9)" : "rgba(0,0,0,0.8)";
    ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = (p.color || "#ffa500") + "33";
    ctx.beginPath(); ctx.arc(px, py, 10, 0, 2*Math.PI); ctx.fill();
    ctx.strokeStyle = (p.color || "#ffa500") + "66";
    ctx.lineWidth = 1;
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(px, plot.Y(0)); ctx.lineTo(px, py); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = (p.color || "#ffa500") + "44";
    ctx.beginPath(); ctx.moveTo(plot.X(0), py); ctx.lineTo(px, py); ctx.stroke();
    ctx.fillStyle = dark ? "#fff" : "#000";
    ctx.font = "10px JetBrains Mono, monospace";
    ctx.textAlign = "center";
    ctx.fillText(`(${p.x.toFixed(2)}, ${p.y.toFixed(2)})`, px, py - 14);
    ctx.restore();
  }
}

plot.onDraw = () => { ucDraw(); drawOverlays(); drawLabels(); drawPlayPoint(); };

/* ── Interação círculo ── */
let ucPrev = null;
let ucPointerId = null;

function ucCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    mx: (e.clientX - rect.left) / rect.width  * plot.W,
    my: (e.clientY - rect.top)  / rect.height * plot.H,
  };
}

canvas.addEventListener("pointerdown", e => {
  if (!ucActive || ucPointerId !== null) return;
  const { cx, cy, rx, ry, r } = ucGetCXYR();
  const { mx, my } = ucCanvasCoords(e);
  const px = cx + rx * Math.cos(ucTheta);
  const py = cy - ry * Math.sin(ucTheta);
  const hit = Math.max(52, r * 0.18);
  if (Math.hypot(mx - px, my - py) > hit) return;
  e.preventDefault();
  e.stopPropagation();
  canvas.setPointerCapture(e.pointerId);
  ucPointerId = e.pointerId;
  ucDragging  = true;
  ucPrev = Math.atan2(-(my - cy)/ry, (mx - cx)/rx);
}, { capture: true });

let ucRaf = null;
canvas.addEventListener("pointermove", e => {
  if (!ucDragging || e.pointerId !== ucPointerId) return;
  e.preventDefault();
  e.stopPropagation();
  const { cx, cy, rx, ry } = ucGetCXYR();
  const { mx, my } = ucCanvasCoords(e);
  const cur = Math.atan2(-(my - cy)/ry, (mx - cx)/rx);
  let delta = cur - ucPrev;
  if (delta >  Math.PI) delta -= 2*Math.PI;
  if (delta < -Math.PI) delta += 2*Math.PI;
  ucTheta += delta;
  ucPrev = cur;
  ucSnapped = ucSnap(ucTheta, 0.1);
  ucUpdateInfo();
  if (!ucRaf) ucRaf = requestAnimationFrame(() => { ucRaf = null; plot.draw(); });
}, { capture: true });

const ucRelease = e => {
  if (e.pointerId !== ucPointerId) return;
  const sn = ucSnap(ucTheta, 0.12);
  if (sn) {
    const turns = Math.round(ucTheta / (2*Math.PI));
    ucTheta = turns * 2*Math.PI + sn.a;
    ucSnapped = sn;
    ucUpdateInfo();
    plot.draw();
  }
  ucDragging  = false;
  ucPointerId = null;
  canvas.releasePointerCapture(e.pointerId);
};
canvas.addEventListener("pointerup",     ucRelease, { capture: true });
canvas.addEventListener("pointercancel", ucRelease, { capture: true });

function ucUpdateInfo() {
  const co = Math.cos(ucTheta), si = Math.sin(ucTheta), tn = si/co;
  const k  = Math.floor(Math.abs(ucTheta) / (2*Math.PI));
  const n  = ucSnapped;
  const sign   = ucTheta < 0 ? -1 : 1;
  const partial2 = Math.abs(ucTheta) % (2*Math.PI);
  const degVal  = sign * partial2 * 180 / Math.PI;
  document.getElementById("uc-cos").textContent = n ? `${n.c}  (${co.toFixed(3)})` : co.toFixed(4);
  document.getElementById("uc-sin").textContent = n ? `${n.s}  (${si.toFixed(3)})` : si.toFixed(4);
  document.getElementById("uc-tan").textContent = n ? n.t : (Math.abs(co)<.01?"∄":tn.toFixed(4));
  const angBase = n ? n.l : `${degVal.toFixed(1)}°`;
  document.getElementById("uc-ang").textContent = k > 0 ? `${angBase} + 2·${k}π` : angBase;
  document.getElementById("uc-snap").textContent = k > 0
    ? (n ? `⊙ notável · k = ${k}` : `k = ${k}`)
    : (n ? "⊙ ângulo notável" : "");
  const tCur = ((ucTheta % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  const tCurSigned = ucTheta < 0 ? tCur - 2*Math.PI : tCur;
  document.querySelectorAll(".uc-abtn").forEach(b => {
    const ba = +b.dataset.a;
    b.classList.toggle("active", Math.abs(tCurSigned - ba) < 0.02 || Math.abs(tCur - ba) < 0.02);
  });
  if (ucActive) {
    const xP = ucTheta; // EXATO: x = θ sem wrap, sem mod
    let yP = NaN;
    const f = formulas.find(f=>!f.hidden && f.inp.value.trim());
    if (f) { try { const c=compile(f.inp.value.trim()); if(c&&!c.error&&c.fn) yP=c.fn(xP); } catch{} }
    if (!isFinite(yP)) yP = Math.sin(ucTheta);
    window._playPoint = { x: xP, y: yP, visible: true };
    // também para _playPoints múltiplos
    const activeFormulas = formulas.filter(f=>!f.hidden && f.inp.value.trim());
    if (activeFormulas.length) {
      window._playPoints = activeFormulas.map(ff => {
        let yy = NaN;
        try { const cc=compile(ff.inp.value.trim()); if(cc&&!cc.error&&cc.fn) yy=cc.fn(xP); } catch{}
        if (!isFinite(yy)) yy = Math.sin(ucTheta);
        return { x: xP, y: yy, visible: true, color: ff.color };
      });
    } else {
      window._playPoints = [{ x: xP, y: yP, visible: true, color: "#ffa500" }];
    }
  } else {
    if (window._playPoint) window._playPoint.visible = false;
    window._playPoints = [];
  }
}

/* ── Ângulos notáveis ── */
const UC_ANGLES = [
  { l:"0",     a:0            },
  { l:"π/6",   a:Math.PI/6   },
  { l:"π/4",   a:Math.PI/4   },
  { l:"π/3",   a:Math.PI/3   },
  { l:"π/2",   a:Math.PI/2   },
  { l:"2π/3",  a:2*Math.PI/3 },
  { l:"3π/4",  a:3*Math.PI/4 },
  { l:"5π/6",  a:5*Math.PI/6 },
  { l:"π",     a:Math.PI     },
  { l:"7π/6",  a:7*Math.PI/6 },
  { l:"5π/4",  a:5*Math.PI/4 },
  { l:"4π/3",  a:4*Math.PI/3 },
  { l:"3π/2",  a:3*Math.PI/2 },
  { l:"5π/3",  a:5*Math.PI/3 },
  { l:"7π/4",  a:7*Math.PI/4 },
  { l:"11π/6", a:11*Math.PI/6},
];

function ucSetAngle(theta) {
  ucTheta   = theta;
  ucSnapped = ucSnap(ucTheta, 0.02);
  ucUpdateInfo();
  plot.draw();
}

const UC_ANGLES_NEG = UC_ANGLES.slice(1).reverse().map(({ l, a }) => ({
  l: "-" + l, a: -a
}));

let ucCurrentTab = "pos";

function ucBuildGrid(tab) {
  const grid = document.getElementById("uc-angle-grid");
  grid.innerHTML = "";
  const angles = tab === "pos" ? UC_ANGLES : UC_ANGLES_NEG;
  angles.forEach(({ l, a }) => {
    const btn = document.createElement("button");
    btn.className = "uc-abtn";
    btn.textContent = l;
    btn.dataset.a = a;
    btn.addEventListener("click", () => ucSetAngle(+btn.dataset.a));
    grid.appendChild(btn);
  });
}

document.getElementById("tab-pos").addEventListener("click", () => {
  ucCurrentTab = "pos";
  document.getElementById("tab-pos").classList.add("active");
  document.getElementById("tab-neg").classList.remove("active");
  ucBuildGrid("pos");
});
document.getElementById("tab-neg").addEventListener("click", () => {
  ucCurrentTab = "neg";
  document.getElementById("tab-neg").classList.add("active");
  document.getElementById("tab-pos").classList.remove("active");
  ucBuildGrid("neg");
});

ucBuildGrid("pos");

document.getElementById("uc-tri-btn")?.addEventListener("click", () => {
  if (!ucActive) return;
  const c = Math.cos(ucTheta), s = Math.sin(ucTheta);
  // Triângulo retângulo: origem (0,0), projeção X (c,0), ponto no círculo (c,s)
  const pts = [{x:0,y:0},{x:c,y:0},{x:c,y:s}];
  overlayMgr.add(OverlayType.TRIANGLE, "plot-main", { color: toolColor, opacity: 0.25, points: pts, showValues: triShowValues });
  // Também marca os 3 vértices
  overlayMgr.add(OverlayType.MARKER, "plot-main", { x:0, y:0, color: toolColor, radius:5, label:"O" });
  overlayMgr.add(OverlayType.MARKER, "plot-main", { x:c, y:0, color: toolColor, radius:5, label: c.toFixed(2) });
  overlayMgr.add(OverlayType.MARKER, "plot-main", { x:c, y:s, color: toolColor, radius:5, label: `(${c.toFixed(2)},${s.toFixed(2)})` });
  plot.draw();
});

let ucPlayRaf = null;
let ucPlayDir = 1; // 1 horário, -1 anti-horário
document.getElementById("uc-play-speed")?.addEventListener("input", e => {
  document.getElementById("uc-speed-val").textContent = parseFloat(e.target.value).toFixed(1) + "x";
});
document.getElementById("uc-dir-btn")?.addEventListener("click", () => {
  ucPlayDir *= -1;
  const btn = document.getElementById("uc-dir-btn");
  btn.textContent = ucPlayDir === 1 ? "↻ Horário" : "↺ Anti";
});
document.getElementById("uc-play-limit")?.addEventListener("input", e => {
  let v = parseInt(e.target.value);
  if (isNaN(v) || v < 1) v = 1;
  if (v > 10) v = 10;
  e.target.value = v;
});
document.getElementById("uc-play-limit")?.addEventListener("change", e => {
  let v = parseInt(e.target.value);
  if (isNaN(v) || v < 1) v = 1;
  if (v > 10) v = 10;
  e.target.value = v;
});
let ucPlayStart = 0;
let ucPlayTurns = 0;
document.getElementById("uc-play-btn")?.addEventListener("click", () => {
  if (!ucActive) { document.getElementById("readout").textContent = "Ative o círculo primeiro"; return; }
  const btn = document.getElementById("uc-play-btn");
  if (ucPlayRaf) {
    cancelAnimationFrame(ucPlayRaf); ucPlayRaf = null;
    btn.textContent = "▶ Play";
    plot.draw();
    return;
  }
  const limit = Math.max(1, Math.min(10, Number(document.getElementById("uc-play-limit").value) || 3));
  const startTheta = ucTheta;
  const targetTurns = limit;
  let lastT = performance.now();
  btn.textContent = "⏸ Pause";
  function step(now) {
    const dt = (now - lastT) / 1000; lastT = now;
    ucTheta += dt * parseFloat(document.getElementById("uc-play-speed").value || 1.2) * ucPlayDir;
    const rawTheta = ucTheta;
    const xPlay = rawTheta; // EXATO
    const activeFormulas = formulas.filter(f=>!f.hidden && f.inp.value.trim());
    window._playPoints = activeFormulas.map(f => {
      let y = NaN;
      try { const c=compile(f.inp.value.trim()); if(c&&!c.error&&c.fn) y=c.fn(xPlay); } catch{}
      if (!isFinite(y)) y = Math.sin(rawTheta);
      return { x: xPlay, y, visible: true, color: f.color };
    });
    if (!window._playPoints.length) {
      window._playPoints = [{ x: xPlay, y: Math.sin(rawTheta), visible: true, color: "#ffa500" }];
    }
    window._playPoint = window._playPoints[0];
    const turns = Math.abs(ucTheta - startTheta) / (2*Math.PI);
    if (turns >= targetTurns) {
      ucTheta = startTheta + targetTurns * 2*Math.PI * ucPlayDir;
      ucSnapped = ucSnap(ucTheta, 0.12);
      ucUpdateInfo(); plot.draw();
      cancelAnimationFrame(ucPlayRaf); ucPlayRaf = null;
      btn.textContent = "▶ Play";
      return;
    }
    ucSnapped = ucSnap(ucTheta, 0.12);
    ucUpdateInfo(); plot.draw();
    ucPlayRaf = requestAnimationFrame(step);
  }
  ucPlayRaf = requestAnimationFrame(step);
});

document.getElementById("uc-negate-btn").addEventListener("click", () => {
  ucSetAngle(-ucTheta);
  const goNeg = ucTheta < 0;
  if (goNeg !== (ucCurrentTab === "neg")) {
    ucCurrentTab = goNeg ? "neg" : "pos";
    document.getElementById("tab-pos").classList.toggle("active", !goNeg);
    document.getElementById("tab-neg").classList.toggle("active", goNeg);
    ucBuildGrid(ucCurrentTab);
  }
});

function parseAngle(raw) {
  raw = raw.trim();
  if (!raw) return null;
  const degMatch = raw.match(/^([+-]?\d+(?:[.,]\d+)?)\s*(?:°|graus?)?$/i);
  if (degMatch) return parseFloat(degMatch[1].replace(",", ".")) * Math.PI / 180;
  const expr = raw
    .replace(/pi/gi, "π")
    .replace(/(\d)π/g, "$1*" + Math.PI)
    .replace(/π(\d)/g, Math.PI + "*$1")
    .replace(/π/g, String(Math.PI));
  try {
    const v = Function('"use strict"; return (' + expr + ')')();
    if (isFinite(v)) return v;
  } catch {}
  return null;
}

document.getElementById("uc-custom-btn").addEventListener("click", () => {
  const inp = document.getElementById("uc-custom-inp");
  const val = parseAngle(inp.value);
  if (val !== null) { inp.value = ""; ucSetAngle(val); }
  else inp.style.borderColor = "#f87171";
  setTimeout(() => inp.style.borderColor = "", 800);
});
document.getElementById("uc-custom-inp").addEventListener("keydown", e => {

});

function setTool(mode, btn) {
  trianglePoints = [];
  areaStart = null;
  arrowStart = null;
  rulerStart = null;
  lastMouseX = null;
  lastMouseY = null;

  toolMode = toolMode === mode ? null : mode;
  document.querySelectorAll(".tool-btn").forEach(b => {
    b.classList.remove("active");
    b.setAttribute("aria-pressed", "false");
  });
  if (toolMode && btn) {
    btn.classList.add("active");
    btn.setAttribute("aria-pressed", "true");
  }
  canvas.style.cursor = toolMode ? "crosshair" : "";
}

function hitTestOverlay(ov, cx, cy, plot) {
  const type = ov.type;
  // converte tolerância de 18px para unidades de dado — suporta plot.view (Plot) e plot.xmax legado
  const _xmin = plot.view ? plot.view.xmin : plot.xmin;
  const _xmax = plot.view ? plot.view.xmax : plot.xmax;
  const _ymin = plot.view ? plot.view.ymin : plot.ymin;
  const _ymax = plot.view ? plot.view.ymax : plot.ymax;
  const tolX = (_xmax - _xmin) / plot.W * 18;
  const tolY = (_ymax - _ymin) / plot.H * 18;
  const tol = Math.max(tolX, tolY);
  if (type === "marker" || type === "point") {
    const dx = (ov.x ?? 0) - cx;
    const dy = (ov.y ?? 0) - cy;
    return Math.sqrt(dx*dx + dy*dy) / tol;
  }
  if (type === "vline") {
    return Math.abs((ov.x ?? 0) - cx) / tolX;
  }
  if (type === "hline") {
    return Math.abs((ov.y ?? 0) - cy) / tolY;
  }
  if (type === "triangle" && ov.points) {
    let minD = Infinity;
    for (const p of ov.points) {
      const d = Math.sqrt((p.x-cx)**2 + (p.y-cy)**2);
      if (d < minD) minD = d;
    }
    return minD / tol;
  }
  if (type === "area") {
    const x1 = ov.x ?? 0, x2 = ov.x2 ?? ov.x;
    if (cx >= Math.min(x1,x2) && cx <= Math.max(x1,x2)) return 0;
    return Math.min(Math.abs(cx - x1), Math.abs(cx - x2)) / tolX;
  }
  if (type === "arrow" || type === "segment" || type === "ruler") {
    const x1=ov.x1??0, y1=ov.y1??0, x2=ov.x2??0, y2=ov.y2??0;
    const len2 = (x2-x1)**2 + (y2-y1)**2;
    if (len2 < 1e-12) return Math.hypot(cx - x1, cy - y1) / tol;
    let t = ((cx - x1)*(x2-x1) + (cy - y1)*(y2-y1)) / len2;
    t = Math.max(0, Math.min(1, t));
    const px = x1 + t*(x2-x1), py = y1 + t*(y2-y1);
    return Math.hypot(cx - px, cy - py) / tol;
  }
  if (type === "text") {
    const dx = (ov.x ?? 0) - cx;
    const dy = (ov.y ?? 0) - cy;
    return Math.sqrt(dx*dx + dy*dy) / tol;
  }
  return Infinity;
}

function snapToReference(x, y, plot) {
  const _xmin = plot.view ? plot.view.xmin : plot.xmin;
  const _xmax = plot.view ? plot.view.xmax : plot.xmax;
  const _ymin = plot.view ? plot.view.ymin : plot.ymin;
  const _ymax = plot.view ? plot.view.ymax : plot.ymax;
  const SNAP_RX = (_xmax - _xmin) * 0.015;
  const SNAP_RY = (_ymax - _ymin) * 0.015;
  const piFracs = [0, Math.PI/6, Math.PI/4, Math.PI/3, Math.PI/2, Math.PI];
  const piSet = new Set();
  for (let k = -12; k <= 12; k++) {
    for (const frac of piFracs) {
      const v = k * Math.PI + frac;
      if (v >= _xmin - 1e-9 && v <= _xmax + 1e-9) piSet.add(Math.round(v*1e10)/1e10);
    }
  }
  // inteiros que não sejam já pi múltiplos
  for (let k = Math.ceil(_xmin); k <= Math.floor(_xmax); k++) {
    const rk = Math.round(k*1e10)/1e10;
    if (!piSet.has(rk)) piSet.add(rk);
  }
  const piValues = [...piSet].sort((a,b)=>a-b);
  const commonY = [-2, -1, -0.5, 0, 0.5, 1, 2].filter(v => v >= _ymin && v <= _ymax);

  let bestX = x, bestXd = Infinity;
  for (const sx of piValues) {
    const d = Math.abs(sx - x);
    if (d < bestXd && d < SNAP_RX) { bestXd = d; bestX = sx; }
  }
  let bestY = y, bestYd = Infinity;
  for (const sy of commonY) {
    const d = Math.abs(sy - y);
    if (d < bestYd && d < SNAP_RY) { bestYd = d; bestY = sy; }
  }
  // Snap à curva: testa y = f(x) para cada fórmula ativa
  let curveSnapped = false;
  for (const f of formulas) {
    if (f.hidden) continue;
    if (!f.inp.value.trim()) continue;
    try {
      const fn = compile(f.inp.value.trim()).fn;
      if (!fn) continue;
      const yCurve = fn(bestX);
      if (!isFinite(yCurve)) continue;
      if (yCurve < _ymin || yCurve > _ymax) continue;
      const dCurve = Math.abs(yCurve - y);
      if (dCurve < SNAP_RY && dCurve < bestYd) {
        bestYd = dCurve;
        bestY = yCurve;
        curveSnapped = true;
      }
    } catch {}
  }
  return { x: bestX, y: bestY, snapped: bestXd < SNAP_RX || bestYd < SNAP_RY || curveSnapped, curveSnapped };
}

canvas.addEventListener("mousemove", e => {
  if (!toolMode) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width  * plot.W;
  const my = (e.clientY - rect.top)  / rect.height * plot.H;
  const x  = plot.invX(mx);
  const y  = plot.invY(my);
  lastMouseX = x;
  lastMouseY = y;

  if (toolMode === "eraser") {
    const all = overlayMgr.getAll();
    let bestDist = Infinity;
    for (const ov of all) {
      const ovFlat = { ...ov.props, type: ov.type };
      const d = hitTestOverlay(ovFlat, x, y, plot);
      if (d < bestDist) bestDist = d;
    }
    currentSnap = null;
    plot.cv.style.cursor = bestDist < 2 ? "crosshair" : "default";
  } else {
    const snapped = snapToReference(x, y, plot);
    currentSnap = snapped.snapped ? snapped : null;
    plot.cv.style.cursor = snapped.snapped ? "cell" : "crosshair";
  }
});

canvas.addEventListener("click", e => {
  if (ucDragging) return;
  if (!toolMode) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width  * plot.W;
  const my = (e.clientY - rect.top)  / rect.height * plot.H;
  const x  = plot.invX(mx);
  const y  = plot.invY(my);

  if (toolMode === "eraser") {
    const all = overlayMgr.getAll();
    let bestIdx = -1, bestDist = Infinity;
    for (let i = 0; i < all.length; i++) {
      const ov = all[i];
      const ovFlat = { ...ov.props, type: ov.type };
      const dist = hitTestOverlay(ovFlat, x, y, plot);
      if (dist < bestDist) { bestDist = dist; bestIdx = i; }
    }
    if (bestIdx >= 0 && bestDist < 2) { overlayMgr.remove(all[bestIdx].id); plot.draw(); document.getElementById("readout").textContent="Anotação removida"; }
    return;
  }

  if (toolMode === "marker") {
    const snapped = snapToReference(x, y, plot);
    overlayMgr.add(OverlayType.MARKER, "plot-main", { x: snapped.x, y: snapped.y, color: toolColor, radius: 7, label: formatExactValue(snapped.x) });
    plot.draw();
  } else if (toolMode === "vline") {
    const snapped = snapToReference(x, y, plot);
    overlayMgr.add(OverlayType.VLINE, "plot-main", { x: snapped.x, color: toolColor, width: 2 });
    plot.draw();
  } else if (toolMode === "hline") {
    const snapped = snapToReference(x, y, plot);
    overlayMgr.add(OverlayType.HLINE, "plot-main", { y: snapped.y, color: toolColor, width: 2 });
    plot.draw();
  } else if (toolMode === "area") {
    const snapped = snapToReference(x, y, plot);
    const sx = snapped.x;
    if (areaStart === null) {
      areaStart = sx;
      const w = Math.abs(sx - areaStart);
      document.getElementById("readout").textContent = `Área largura Δx=${w.toFixed(2)} — clique para sombrear triângulo também`;
    } else {
      overlayMgr.add(OverlayType.AREA, "plot-main", { color: toolColor, opacity: areaOpacity, x: Math.min(areaStart, sx), x2: Math.max(areaStart, sx) });
      const h = plot.ymax - plot.ymin;
      const areaVal = (Math.abs(sx - areaStart) * h).toFixed(2);
      document.getElementById("readout").textContent = `Área retangular ≈ ${areaVal} (Δx=${Math.abs(sx-areaStart).toFixed(2)} × Δy=${h.toFixed(2)})`;
      // Se houver triângulo visível, mostre sua área no readout
      const tris = overlayMgr.getAll().filter(o=>o.type==="triangle" && !o.props.hidden);
      if (tris.length>0) {
        const pts = tris[tris.length-1].props.points;
        const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
        const la=d(pts[0],pts[1]), lb=d(pts[1],pts[2]), lc=d(pts[2],pts[0]);
        const s=(la+lb+lc)/2;
        const aTri=Math.sqrt(Math.max(0,s*(s-la)*(s-lb)*(s-lc))).toFixed(2);
        document.getElementById("readout").textContent += ` · Triângulo área=${aTri}`;
      }
      areaStart = null;
      setTool(null, null);
      plot.draw();
    }
  } else if (toolMode === "triangle") {
    const snapped = snapToReference(x, y, plot);
    trianglePoints.push({ x: snapped.x, y: snapped.y });
    document.getElementById("readout").textContent = `x = ${snapped.x.toFixed(2)}   y = ${snapped.y.toFixed(2)}`;
    if (trianglePoints.length === 3) {
      overlayMgr.add(OverlayType.TRIANGLE, "plot-main", {
        color: toolColor, opacity: 0.25,
        points: trianglePoints, showValues: triShowValues
      });
      trianglePoints = [];
      setTool(null, null);
      plot.draw();
    } else {
      plot.draw();
      const ctx = plot.ctx;
      ctx.save();
      ctx.fillStyle = toolColor;
      for (const p of trianglePoints) {
        ctx.beginPath();
        ctx.arc(plot.X(p.x), plot.Y(p.y), 5, 0, 2*Math.PI);
        ctx.fill();
      }
      if (trianglePoints.length === 1) {
        ctx.strokeStyle = toolColor + "40";
        ctx.lineWidth = 1;
        ctx.setLineDash([4,4]);
        ctx.beginPath();
        ctx.moveTo(plot.X(trianglePoints[0].x), plot.Y(trianglePoints[0].y));
        ctx.lineTo(plot.X(snapped.x), plot.Y(snapped.y));
        ctx.stroke();
        ctx.setLineDash([]);
      } else if (trianglePoints.length === 2) {
        ctx.strokeStyle = toolColor + "40";
        ctx.lineWidth = 1;
        ctx.setLineDash([4,4]);
        for (const p of trianglePoints) {
          ctx.beginPath();
          ctx.moveTo(plot.X(p.x), plot.Y(p.y));
          ctx.lineTo(plot.X(snapped.x), plot.Y(snapped.y));
          ctx.stroke();
        }
        ctx.setLineDash([]);
      }
      ctx.restore();
    }
  } else if (toolMode === "text") {
    const snapped = snapToReference(x, y, plot);
    const txt = prompt("Texto da anotação:");
    if (txt) {
      overlayMgr.add(OverlayType.TEXT, "plot-main", { x: snapped.x, y: snapped.y, text: txt, color: toolColor, fontSize: 14 });
      plot.draw();
    }
  } else if (toolMode === "arrow") {
    const snapped = snapToReference(x, y, plot);
    if (arrowStart === null) {
      arrowStart = { x: snapped.x, y: snapped.y };
    } else {
      overlayMgr.add(OverlayType.ARROW, "plot-main", {
        x1: arrowStart.x, y1: arrowStart.y, x2: snapped.x, y2: snapped.y,
        color: toolColor, width: 2,
      });
      arrowStart = null;
      setTool(null, null);
      plot.draw();
    }
  } else if (toolMode === "ruler") {
    const snapped = snapToReference(x, y, plot);
    if (rulerStart === null) {
      rulerStart = { x: snapped.x, y: snapped.y };
    } else {
      overlayMgr.add(OverlayType.RULER, "plot-main", { x1: rulerStart.x, y1: rulerStart.y, x2: snapped.x, y2: snapped.y, color: toolColor, width: 2 });
      rulerStart = null;
      setTool(null, null);
      plot.draw();
    }
  }
});

canvas.addEventListener("pointerdown", e => {

function drawOverlays() {
  const ctx = plot.ctx;

  const allOverlays = overlayMgr.getAll();
  for (const ov of allOverlays) {
    if (ov.props.hidden) continue;
    const ovFlat = { ...ov.props, type: ov.type };
    renderOverlaysOnPlot(ctx, plot, [ovFlat], formatExactValue);
  }

  if (areaStart !== null) {
    const px = plot.X(areaStart);
    ctx.strokeStyle = toolColor + "bb"; ctx.lineWidth = 2; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, plot.H); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = toolColor; ctx.font = "10px monospace";
    ctx.textAlign = "center"; ctx.fillText("→ clique p/ fechar área", px, 14);

    if (lastMouseX !== null) {
      const px2 = plot.X(lastMouseX);
      const left = Math.min(px, px2);
      const right = Math.max(px, px2);
      ctx.fillStyle = toolColor + "15";
      ctx.fillRect(left, 0, right - left, plot.H);
      ctx.strokeStyle = toolColor + "40";
      ctx.lineWidth = 1;
      ctx.setLineDash([2,2]);
      ctx.strokeRect(left, 0, right - left, plot.H);
      ctx.setLineDash([]);
      const w = Math.abs(lastMouseX - areaStart).toFixed(2);
      ctx.fillStyle = toolColor;
      ctx.font = "11px monospace";
      ctx.textAlign = "center";
      ctx.fillText(`Δx=${w}`, (px + plot.X(lastMouseX))/2, 28);
    }
  }

  if (arrowStart !== null) {
    const px = plot.X(arrowStart.x);
    const py = plot.Y(arrowStart.y);
    ctx.fillStyle = toolColor;
    ctx.beginPath(); ctx.arc(px, py, 5, 0, 2*Math.PI); ctx.fill();

    if (lastMouseX !== null && lastMouseY !== null) {
      const px2 = plot.X(lastMouseX);
      const py2 = plot.Y(lastMouseY);
      ctx.strokeStyle = toolColor + "60";
      ctx.lineWidth = 2;
      ctx.setLineDash([4,4]);
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px2, py2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  if (rulerStart !== null) {
    const px = plot.X(rulerStart.x); const py = plot.Y(rulerStart.y);
    ctx.fillStyle = toolColor; ctx.beginPath(); ctx.arc(px, py, 5, 0, 2*Math.PI); ctx.fill();
    if (lastMouseX !== null) {
      const px2 = plot.X(lastMouseX), py2 = plot.Y(lastMouseY);
      ctx.strokeStyle = toolColor + "60"; ctx.lineWidth = 2; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px2,py2); ctx.stroke(); ctx.setLineDash([]);
      const dx = lastMouseX - rulerStart.x, dy = lastMouseY - rulerStart.y;
      const d = Math.hypot(dx,dy).toFixed(2);
      ctx.fillStyle = toolColor; ctx.font="11px monospace"; ctx.textAlign="center";
      ctx.fillText(`d=${d}`, (px+px2)/2, (py+py2)/2 -8);
    }
  }

  if (currentSnap && toolMode && toolMode !== "eraser") {
    ctx.strokeStyle = toolColor + "60";
    ctx.lineWidth = 1;
    ctx.setLineDash([3,3]);
    const sx = plot.X(currentSnap.x);
    const sy = plot.Y(currentSnap.y);
    ctx.beginPath();
    ctx.moveTo(sx, 0); ctx.lineTo(sx, plot.H);
    ctx.moveTo(0, sy); ctx.lineTo(plot.W, sy);
    ctx.stroke();
    ctx.setLineDash([]);
    if (currentSnap.curveSnapped) {
      const py = plot.Y(currentSnap.y);
      ctx.fillStyle = toolColor;
      ctx.beginPath(); ctx.arc(sx, py, 4, 0, 2*Math.PI); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }
}

/* ──────────── FÓRMULAS ──────────── */
let formulas = [];
let piActive = false, circleActive = false;

const PALETTE = [
  "#ffa500","#ffd23f","#60a5fa","#34d399","#a78bfa","#fb923c","#f472b6","#38bdf8",
  "#e11d48","#16a34a","#7c3aed","#0ea5e9","#d97706","#059669","#dc2626","#6366f1",
  "#f59e0b","#10b981","#3b82f6","#ec4899",
];

let _palTarget = null;
const palette = document.getElementById("color-palette");
palette.innerHTML = PALETTE.map(c =>
  `<div class="cp-swatch" style="background:${c}" data-c="${c}"></div>`
).join("");

palette.querySelectorAll(".cp-swatch").forEach(sw => {
  sw.addEventListener("click", e => {
    e.stopPropagation();
    if (!_palTarget) return;
    const newColor = sw.dataset.c;
    _palTarget.color = newColor;
    _palTarget.dot.style.background = newColor;
    palette.querySelectorAll(".cp-swatch").forEach(s =>
      s.classList.toggle("active", s.dataset.c === newColor));
    updatePlot();
  });
});

document.addEventListener("click", () => {
  palette.classList.add("hidden");
  _palTarget = null;
});

function openPalette(dot, formula) {
  _palTarget = formula;
  const rect = dot.getBoundingClientRect();
  const palW = 160;
  const palH = 120;
  let left = rect.right + 8;
  if (left + palW > window.innerWidth) left = rect.left - palW - 8;
  if (left < 0) left = 8;
  let top = Math.min(rect.top, window.innerHeight - palH - 8);
  if (top < 0) top = 8;
  palette.style.left = left + "px";
  palette.style.top  = top + "px";
  palette.classList.remove("hidden");
  palette.querySelectorAll(".cp-swatch").forEach(s =>
    s.classList.toggle("active", s.dataset.c === formula.color));
}

function addFormula(expr="") {
  const idx = formulas.length;
  const color = COLORS[idx % COLORS.length];
  const row = document.createElement("div");
  row.className = "frow";
  row.innerHTML = `
    <span class="frow-dot" style="background:${color}" title="Mudar cor"></span>
    <input class="frow-inp" name="f${idx}" autocomplete="off" placeholder="y=..." value="${expr}" spellcheck="false">
    <button class="frow-eye" aria-label="Mostrar/ocultar" title="Ocultar">◐</button>
    <button class="frow-del" aria-label="Remover fórmula" title="Remover fórmula">×</button>`;
  const inp = row.querySelector("input");
  const dot = row.querySelector(".frow-dot");
  const eye = row.querySelector(".frow-eye");
  const del = row.querySelector(".frow-del");
  inp.addEventListener("input", updatePlot);
  del.addEventListener("click", () => {
    row.remove(); formulas = formulas.filter(f => f.inp !== inp); updatePlot();
  });
  const formula = { inp, color, dot, eye, hidden:false };
  eye.addEventListener("click", () => { formula.hidden = !formula.hidden; eye.textContent = formula.hidden ? "○" : "◐"; eye.style.opacity = formula.hidden ? ".4" : "1"; eye.title = formula.hidden ? "Mostrar" : "Ocultar"; updatePlot(); });
  dot.addEventListener("click", e => {
    e.stopPropagation();
    openPalette(dot, formula);
  });
  document.getElementById("formulas-rows").appendChild(row);
  formulas.push(formula);
  updatePlot();
}

function updatePlot() {
  const curves = formulas.filter(f=>!f.hidden).map(({inp,color}) => {
    const expr = inp.value.trim(); if (!expr) return null;
    try { const c=compile(expr); return (c&&!c.error)?{fn:c.fn,color}:null; } catch { return null; }
  }).filter(Boolean);
  plot.setCurves(curves);
  // sync para SVG (apenas visíveis)
  if (plot.setLabels) plot.setLabels(formulas.filter(f=>!f.hidden && f.inp.value.trim()).map(f=>({ text: f.inp.value.trim(), color: f.color })));
}

function setView(v) {
  const def = piActive
    ? {xmin:-2*Math.PI,xmax:2*Math.PI,ymin:-3,ymax:3}
    : {xmin:-6,xmax:6,ymin:-4,ymax:4};
  plot.setView(v||def);
}

function animateView(target, ms=300) {
  const start = {...plot.view};
  const t0 = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - t0)/ms);
    const e = 1 - Math.pow(1-t,3); // easeOutCubic
    plot.view.xmin = start.xmin + (target.xmin - start.xmin)*e;
    plot.view.xmax = start.xmax + (target.xmax - start.xmax)*e;
    plot.view.ymin = start.ymin + (target.ymin - start.ymin)*e;
    plot.view.ymax = start.ymax + (target.ymax - start.ymax)*e;
    plot.draw();
    if (t<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
window.__animateView = animateView;
window.__setView = setView;
window.__getUcTheta = () => ucTheta;
window.__ucActive = () => ucActive;

document.getElementById("btn-add").addEventListener("click", ()=>addFormula());

const btnPi = document.getElementById("btn-pi");
btnPi.addEventListener("click", ()=>{
  piActive=!piActive; btnPi.classList.toggle("active",piActive);
  plot.setPiAxis(piActive); setView(null);
});

const btnCircle = document.getElementById("btn-circle");
btnCircle.addEventListener("click", ()=>{
  circleActive=!circleActive; btnCircle.classList.toggle("active",circleActive);
  ucActive = circleActive;
  document.getElementById("uc-info").classList.toggle("show",circleActive);
  if (circleActive) ucUpdateInfo();
  plot.draw();
});

document.getElementById("btn-reset").addEventListener("click", ()=>{ setView(null); plot.draw(); });

/* ── Download ── */
const btnDownload = document.getElementById("btn-download");
const downloadMenu = document.getElementById("download-menu");
btnDownload.addEventListener("click", e => {
  e.stopPropagation();
  downloadMenu.classList.toggle("open");
});
downloadMenu.querySelectorAll("button").forEach(btn => {
  btn.addEventListener("click", () => {
    const fmt = btn.dataset.format;
    if (fmt === "png") plot.exportPNG(2);
    else if (fmt === "svg") plot.exportSVG();
    downloadMenu.classList.remove("open");
  });
});
document.addEventListener("click", () => downloadMenu.classList.remove("open"));

/* ── Presets ── */
const presetsEl = document.getElementById("prof-presets");
const allPresets = PRESET_GROUPS.flatMap(g=>g.items.map(p=>({...p,group:g.title})));
presetsEl.innerHTML = PRESET_GROUPS.map(g=>`
  <div class="preset-group">
    <div class="preset-group-title">${g.title}</div>
    <div class="preset-btns">
      ${g.items.map(p=>`<button class="preset-btn" data-g="${g.title}" data-label="${p.label}">${p.label}</button>`).join("")}
    </div>
  </div>`).join("");

presetsEl.querySelectorAll(".preset-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    presetsEl.querySelectorAll(".preset-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const p = allPresets.find(x=>x.group===btn.dataset.g&&x.label===btn.dataset.label);
    if (!p) return;
    // Acrescenta sem apagar, sem mexer na perspectiva
    p.fns.forEach(fn => {
      const exists = formulas.some(f => f.inp.value.trim() === fn);
      if (!exists && formulas.length < 8) addFormula(fn);
    });
    if (p.pi !== piActive) { piActive = p.pi; btnPi.classList.toggle("active", p.pi); plot.setPiAxis(p.pi); }
    if (p.uc !== circleActive) {
      circleActive = p.uc; btnCircle.classList.toggle("active", p.uc);
      ucActive = p.uc;
      document.getElementById("uc-info").classList.toggle("show", p.uc);
      if (p.uc) ucUpdateInfo();
      else plot.draw();
    }
  });
});

window.addEventListener("themechange", ()=>{ plot.draw(); });

overlayMgr.onChange(() => plot.draw());
function renderLayers() {
  const list = document.getElementById("layers-list");
  const count = document.getElementById("layers-count");
  const all = overlayMgr.getAll();
  count.textContent = all.length;
  if (all.length === 0) { list.innerHTML = '<span style="font-size:.7rem;color:var(--text-mut);padding:.2rem">Nenhuma anotação</span>'; return; }
  list.innerHTML = all.map((o, idx) => {
    const label = o.type === "marker" ? `Ponto (${(o.props.x??0).toFixed(1)},${(o.props.y??0).toFixed(1)})`
      : o.type === "vline" ? `V x=${(o.props.x??0).toFixed(2)}`
      : o.type === "hline" ? `H y=${(o.props.y??0).toFixed(2)}`
      : o.type === "area" ? `Área [${(o.props.x??0).toFixed(1)},${(o.props.x2??o.props.x).toFixed(1)}]`
      : o.type === "triangle" ? `Triângulo`
      : o.type === "arrow" ? `Seta`
      : o.type === "text" ? `Texto: ${(o.props.text||"").slice(0,12)}`
      : o.type === "ruler" ? `Régua`
      : o.type;
    const isHidden = !!o.props.hidden;
    const eyeIcon = isHidden ? "○" : "◐";
    const eyeTitle = isHidden ? "Mostrar" : "Ocultar";
    const rowOpacity = isHidden ? "0.55" : "1";
    return `<div style="display:flex;align-items:center;gap:.3rem;padding:.25rem .3rem;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;font-size:.7rem;opacity:${rowOpacity}">
      <span style="width:8px;height:8px;border-radius:50%;background:${o.props.color||"#ffa500"};flex-shrink:0"></span>
      <span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${label}</span>
      <button data-layer-eye="${o.id}" aria-label="${eyeTitle} anotação" title="${eyeTitle}" style="background:transparent;border:1px solid var(--border);color:var(--text-mut);cursor:pointer;padding:.15rem .35rem;border-radius:4px;min-height:28px;min-width:28px;display:flex;align-items:center;justify-content:center;font-size:.75rem">${eyeIcon}</button>
      <button data-layer-del="${o.id}" aria-label="Apagar anotação" title="Apagar" style="background:transparent;border:1px solid var(--border);color:var(--text-mut);cursor:pointer;padding:.15rem .35rem;border-radius:4px;min-height:28px;min-width:28px;display:flex;align-items:center;justify-content:center;font-size:.75rem">×</button>
    </div>`;
  }).join("");
  list.querySelectorAll("[data-layer-eye]").forEach(btn => {
    btn.addEventListener("click", () => {
      const ov = overlayMgr.get(btn.dataset.layerEye);
      if (!ov) return;
      overlayMgr.update(btn.dataset.layerEye, { hidden: !ov.props.hidden });
      plot.draw();
    });
  });
  list.querySelectorAll("[data-layer-del]").forEach(btn => {
    btn.addEventListener("click", () => { overlayMgr.remove(btn.dataset.layerDel); plot.draw(); });
  });
  // remoção via clique duplo na linha (UX extra)
  Array.from(list.children).forEach(row => {
    row.addEventListener("dblclick", () => {
      const delBtn = row.querySelector("[data-layer-del]");
      if (delBtn) { overlayMgr.remove(delBtn.dataset.layerDel); plot.draw(); document.getElementById("readout").textContent="Anotação removida"; }
    });
  });
}
overlayMgr.onChange(renderLayers);
renderLayers();
overlayMgr.onChange(() => {
  plot._overlays = overlayMgr.getAll().filter(o => !o.props.hidden).map(o => ({
    draw: (ctx, p) => renderOverlaysOnPlot(ctx, p, [{ ...o.props, type: o.type }], formatExactValue)
  }));
});
plot._overlays = overlayMgr.getAll().filter(o => !o.props.hidden).map(o => ({
  draw: (ctx, p) => renderOverlaysOnPlot(ctx, p, [{ ...o.props, type: o.type }], formatExactValue)
}));
document.getElementById("tool-undo").addEventListener("click", () => { overlayMgr.undo(); plot.draw(); });
document.getElementById("tool-redo").addEventListener("click", () => { overlayMgr.redo(); plot.draw(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    downloadMenu.classList.remove("open");
    palette.classList.add("hidden");
    if (activeSheetPanel) closeSheet();
  }
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if ((e.ctrlKey || e.metaKey) && e.key === "z" && !e.shiftKey) { e.preventDefault(); overlayMgr.undo(); plot.draw(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === "y" || (e.key === "z" && e.shiftKey))) { e.preventDefault(); overlayMgr.redo(); plot.draw(); }
  if (e.key === "d" || e.key === "D") { e.preventDefault(); plot.exportPNG(2); }
  if (e.key === "r" || e.key === "R") { e.preventDefault(); setView(null); plot.draw(); }
});

/* ── Bottom sheet (mobile) ── */
const bottomBar = document.getElementById("prof-bottom-bar");
const sheetOverlay = document.getElementById("sheet-overlay");
const profPanel = document.getElementById("prof-panel");
const profSheetEl = document.getElementById("prof-sheet");
let activeSheetPanel = null;

function openSheet(panelName) {
  if (activeSheetPanel === panelName) { closeSheet(); return; }
  activeSheetPanel = panelName;
  profPanel.classList.add("open");
  sheetOverlay.classList.add("open");
  bottomBar.querySelectorAll(".prof-bar-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.panel === panelName);
  });
}

function closeSheet() {
  activeSheetPanel = null;
  profPanel.classList.remove("open");
  sheetOverlay.classList.remove("open");
  bottomBar.querySelectorAll(".prof-bar-btn").forEach(b => b.classList.remove("active"));
}

bottomBar.querySelectorAll("[data-panel]").forEach(btn => {
  btn.addEventListener("click", () => openSheet(btn.dataset.panel));
});
bottomBar.querySelectorAll("[data-action]").forEach(btn => {
  btn.addEventListener("click", () => {
    if (btn.dataset.action === "reset") { setView(null); plot.draw(); }
    if (btn.dataset.action === "theme") { document.getElementById("theme-btn").click(); }
  });
});
sheetOverlay.addEventListener("click", closeSheet);
document.querySelector(".prof-sheet-handle")?.addEventListener("click", closeSheet);

addFormula("y=2^x"); addFormula("y=(1/2)^x");
</script>
</body>
</html>
