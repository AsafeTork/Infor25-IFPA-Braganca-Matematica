<style>
/* 30x ORGANIZAÇÃO/RESPONSIVIDADE — professor.html inline (complementa styles/professor.css)
   Fontes websearch 2025 (cite):
   - responsive design organization 2025: ParallelHQ, BuildNar, NextNative, UXPin (mobile-first, Grid+Flex, container queries)
   - CSS grid positioning patterns: Devopedia, Shenalitha auto-fit/minmax, Blueprint 1→2→3 col
   - mobile first isometry: Grafana Canvas + MDN Pinch + tigerabrodi pinch vs scroll + SO canvas responsive
   - sidebar responsive experience: W3Schools fixed→topbar, Solodev dropdown <991, UX Patterns localStorage, Navbar Gallery 200–320
   Este bloco mantém compatibilidade de legacy + afina 320/375/414 sem duplicar professor.css:
   - tools-grid SEMPRE 3×3 (repeat(3,1fr)), nunca 2; preset vira 2 só <360 para não clipar em 320
   - touch 44×44 em mobile via CSS principal; aqui só garante fallback se CSS não carregar */
.tools-grid{grid-template-columns:repeat(3, minmax(0,1fr));gap:calc(.42rem * var(--info-scale,1))}
.tools-grid .tool-btn{min-width:calc(44px * var(--info-scale,1));min-height:calc(44px * var(--info-scale,1));height:calc(44px * var(--info-scale,1));padding:0;justify-content:center;gap:0;aspect-ratio:1}
@media(max-width:359px){.preset-btns{grid-template-columns:repeat(2, minmax(0,1fr))!important}}
</style>
</head>

  <div class="al-zoom prof-font-ctrl" aria-label="Zoom interface">

    <span class="al-zoom-label" id="font-val-ui">100%</span>
    <button class="al-zoom-btn" id="font-inc-ui" aria-label="Aumentar fonte interface" title="Aumentar fonte interface"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 7 V17"/><path d="M7 12 H17"/></svg></button>

  <button class="theme-toggle" id="theme-btn" aria-label="Alternar tema" title="Alternar tema"></button>
</header>

<div class="prof-wrap">

    <div class="prof-labels" id="prof-labels"></div>

      <span class="al-zoom-label" id="font-val-graph">100%</span>
      <button class="al-zoom-btn" id="font-inc-graph" aria-label="Aumentar gráfico" title="Aumentar gráfico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 7 V17"/><path d="M7 12 H17"/></svg></button>
    </div>
  </div>

  <!-- Painel lateral (desktop/tablet) — ORGANIZAÇÃO 30x: ordem canônica
       1 Fórmulas (flex-shrink:0) → 2 Controles (flex-shrink:0) → uc-info (flex-shrink:0, só quando ativo)
       → 3 Ferramentas (flex-shrink:0, tools-grid 3×3) → 4 Camadas (flex-shrink:0, max-height 22dvh)
       → 5 Presets (flex:1, scroll interno) → 6 Readout (flex-shrink:0, margin-top:auto)
       Cada seção com border 1px var(--border), título mono .6rem uppercase, gap 1px isométrico.
       Responsivo 320/375/414/480/768/1024/1280/1440/1920 sem sobreposição (z 50>45>40>39>38>30). -->
    <div class="prof-panel" id="prof-panel" role="complementary" aria-label="Painel de controle">
    <!-- Sair do Modo Aula (só visível com body.modo-aula; no fluxo do painel, não cobre controles) -->

        <button class="ctrl-btn" id="btn-circle" aria-label="Alternar círculo unitário" title="Alternar círculo unitário"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="1.05" fill="currentColor" stroke="none"/><path d="M12 12 L17.7 6.3"/><circle cx="17.7" cy="6.3" r="1.25" fill="currentColor" stroke="none"/><path d="M14.2 12 A2.4 2.4 0 0 0 15.7 9.3"/></svg></button>
        <button class="ctrl-btn" id="btn-reset" aria-label="Resetar vista" title="Resetar vista"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19.2 12 A7.2 7.2 0 1 1 6.8 7.3"/><path d="M19.2 5.2 V12 H12.4"/><path d="M15.4 7.4 L19.2 5.2 L17 9"/></svg></button>
        <button class="ctrl-btn" id="btn-aula" aria-pressed="false" aria-label="Modo Aula (tecla F)" title="Modo Aula (F)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="5.5" width="18" height="12.5" rx="2"/><path d="M9.5 21 h5"/><path d="M10.6 9.4 L15 11.8 L10.6 14.2 Z" fill="currentColor" stroke="none"/></svg></button>
        <div class="prof-download-wrap">

          <div class="prof-download-menu" id="download-menu" role="menu">
            <button role="menuitem" data-format="png"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" style="margin-right:.35rem;flex-shrink:0"><rect x="3.5" y="3" width="12" height="15" rx="1.5"/><circle cx="8.5" cy="8" r="1.4"/><path d="M3.5 14 L8 9 L12 12 L15.5 8.5 L15.5 14.5"/></svg> PNG (2x)</button>

        </div>
      </div>

      <label style="display:flex;align-items:center;gap:.3rem;margin-top:.3rem;font-size:calc(.68rem * var(--info-scale,1));color:var(--text-mut);cursor:pointer">

    </div>

    <div class="panel-tabs" role="tablist">

        <button class="panel-tab" data-tab="ferramentas" role="tab" aria-selected="false">Ferramentas</button>
      </div>

    <div class="prof-tabs-scroll">
      <div class="tab-panel active" data-tab="formulas">
        <div class="prof-section" id="sec-formulas">
      <div class="prof-section-title">Fórmulas</div>
      <div id="formulas-rows"></div>

    </div>
        <div id="prof-presets"></div>

      <div class="tab-panel" data-tab="angulo">

          <button class="uc-tab" id="tab-neg" aria-label="Ângulos negativos" title="Ângulos negativos"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" style="margin-right:.3rem;flex-shrink:0"><path d="M12 19.5 A7.5 7.5 0 0 0 4.8 12.2"/><path d="M12 19.5 L15.4 17.4 L13.9 14.4"/><path d="M8.2 14.8 H11 V17.6"/></svg> − negativos</button>
        </div>
        <div class="uc-angle-grid" id="uc-angle-grid"></div>
        <div class="uc-custom">
          <input id="uc-custom-inp" name="uc-angle" autocomplete="off" placeholder="ex: -π/3 ou -90°" aria-label="Ângulo personalizado">

        </div>
      </div>
      <button class="uc-tri-btn" id="uc-tri-btn" aria-label="Triângulo no círculo" title="Triângulo no círculo" style="width:100%;margin-top:.5rem;padding:.42rem;background:var(--accent);color:#000;border:none;border-radius:8px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:44px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"/><path d="M12 12 L19 12 L14.6 5.4 Z"/><path d="M17.2 10.2 V12 H19" stroke-width="1.4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="14.6" cy="5.4" r="1" fill="currentColor" stroke="none"/></svg></button>
      <div style="display:flex;gap:.4rem;margin-top:.4rem;align-items:center;flex-wrap:wrap;min-width:0">
        <button id="uc-play-btn" aria-label="Play animação círculo" title="Play" style="flex:1;padding:.35rem;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:8px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:44px;min-width:44px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9.2 7 L18.2 12 L9.2 17 Z" fill="currentColor" stroke="none" opacity="0.95"/><path d="M9.2 7 L18.2 12 L9.2 17 Z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M7 12 A5 5 0 0 1 12 7" stroke-dasharray="2 2.2" opacity="0.55"/></svg></button>
        <label style="display:flex;align-items:center;gap:.25rem;font-size:calc(.7rem * var(--info-scale,1));color:var(--text-mut)"><span>voltas</span><input id="uc-play-limit" type="number" min="1" max="10" value="3" style="width:40px;padding:.2rem;border:1px solid var(--border);border-radius:4px;background:var(--surface-2);color:var(--text);text-align:center"></label>
        <label style="display:flex;align-items:center;gap:.25rem;font-size:calc(.7rem * var(--info-scale,1));color:var(--text-mut)"><span>vel</span><input id="uc-play-speed" type="range" min="0.2" max="3" step="0.2" value="1.2" style="width:60px;accent-color:var(--accent)"><span id="uc-speed-val" style="min-width:22px;text-align:center">1.2x</span></label>
        <button id="uc-dir-btn" aria-label="Alternar direção horário" title="Direção: horário/anti-horário" style="padding:.35rem;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:8px;cursor:pointer;min-height:44px;min-width:44px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19.2 12 A7.2 7.2 0 1 1 12 4.8"/><path d="M12 4.8 V9.2 H16.4"/><path d="M12 4.8 L9.2 7.2 L12.9 9.2"/></svg></button>

      </div>
      <div style="display:flex;gap:.4rem;margin-top:.4rem;align-items:center;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:.3rem;font-size:calc(.68rem * var(--info-scale,1));color:var(--text-mut);cursor:pointer;white-space:nowrap">
          <input type="checkbox" id="toggle-trace" style="accent-color:var(--accent)"> Rastro
        </label>
        <label style="display:flex;align-items:center;gap:.3rem;font-size:calc(.68rem * var(--info-scale,1));color:var(--text-mut);cursor:pointer;white-space:nowrap">
          <input type="checkbox" id="toggle-markers" checked style="accent-color:var(--accent)"> Marcadores
        </label>
      </div>
    </div>
      </div>

      <div class="tab-panel" data-tab="ferramentas">
        <details class="tools-details" id="tools-section">
        <summary class="preset-group-title" style="cursor:pointer;padding:.3rem .25rem;list-style:none;display:flex;justify-content:space-between" aria-label="Ferramentas de anotação" title="Ferramentas de anotação">

          <div class="tools-grid" role="toolbar" aria-label="Ferramentas" aria-orientation="horizontal">
            <button class="tool-btn" type="button" id="tool-marker" aria-pressed="false" aria-label="Marcar ponto" title="Marcar ponto">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="7.2"/>
                <path d="M12 4.9 V8.1"/>
                <path d="M12 15.9 V19.1"/>
                <path d="M4.9 12 H8.1"/>
                <path d="M15.9 12 H19.1"/>
                <circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/>
              </svg>
            </button>
            <button class="tool-btn" type="button" id="tool-vline" aria-pressed="false" aria-label="Linha vertical" title="Linha vertical">

                <path d="M4.8 12 H19.2"/>
                <path d="M8.4 8.7 L4.8 12 L8.4 15.3"/>
                <path d="M15.6 8.7 L19.2 12 L15.6 15.3"/>

                <path d="M16.4 9.2 V14.8" stroke-width="1.4"/>

            </button>
            <button class="tool-btn" type="button" id="tool-area" aria-pressed="false" aria-label="Sombrear área" title="Sombrear área">

              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M12 4.2 L3.9 19.1 L20.1 19.1 Z"/>
